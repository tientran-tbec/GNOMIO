unt of walking they</mark> do with motion sensors, you find that only 6% of men and 4% of women do the recommended amount of exercise.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:49</span><span class=\"txt\">So you can see why obesity is growing.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:52</span><span class=\"txt\">So how can people be encouraged to take more exercise?</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:57</span><span class=\"txt\">Well, for example, think of the location of stairs in a train <mark data-q=\"28\">station.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:03</span><span class=\"txt\"><mark data-q=\"28\">If people reach the stairs before they reach the escalator when they're leaving the station, they're more likely to take the stairs.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:11</span><span class=\"txt\"><mark data-q=\"28\">And if you increase the width of the stairs, you'll get more people using them at the same time.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:17</span><span class=\"txt\"><mark data-q=\"28\">It's an unconscious process and influenced by minor modifications in their environment.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:23</span><span class=\"txt\">Right. And it might not be a big change, but if it happens every day, it all adds up.</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:30</span><span class=\"txt\">Yes. But actually, <mark data-q=\"29\">I'm not sure if we should be talking about exercise in our presentation.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:35</span><span class=\"txt\"><mark data-q=\"29\">Well, we've done quite a bit of reading about it.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:38</span><span class=\"txt\"><mark data-q=\"29\">I know, but it's going to mean we have a very wide focus.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:43</span><span class=\"txt\"><mark data-q=\"29\">And our tutor did say that we need to focus on causes and solutions in terms of nutrition.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:48</span><span class=\"txt\"><mark data-q=\"29\">Oh, I suppose so. And we've got plenty of information about that.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:54</span><span class=\"txt\"><mark data-q=\"29\">OK. Well, that will be simpler.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:57</span><span class=\"txt\"><mark data-q=\"29\">So what shall</mark> we do now? We've still got <mark data-q=\"30\">half an hour before our next lecture.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:03</span><span class=\"txt\"><mark data-q=\"30\">Let's think about what we're going to include and what will go where.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:07</span><span class=\"txt\"><mark data-q=\"30\">Then we can decide what slides we need.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:09</span><span class=\"txt\"><mark data-q=\"30\">OK. Fine.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:14</span><span class=\"txt\"><mark data-q=\"30\">That is the end of part three.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:16</span><span class=\"txt\"><mark data-q=\"30\">You now have half a</mark> minute to check your answers to part three.</span></div>", "script_source": "asr (Whisper transcript provided by user, answer positions located via KEY + Teacher's Book)"}, {"part": 4, "audio": "Test1_Listening_audio/part4.mp3", "title": "Bird Migration Theory", "instructions": "Complete the notes below. Write ONE WORD ONLY for each answer.", "kind": "notes", "notes": ["Most birds are believed to migrate seasonally.", "Hibernation theory", "It was believed that birds hibernated underwater or buried themselves in {{31}} .", "This theory was later disproved by experiments on caged birds.", "Transmutation theory", "Aristotle believed birds changed from one species into another in summer and winter.", "–  In autumn he observed that redstarts experience the loss of {{32}} and thought they then turned into robins.", "–  Aristotle’s assumptions were logical because the two species of birds had a similar {{33}} .", "17th century", "Charles Morton popularised the idea that birds fly to the {{34}} in winter.", "Scientific developments", "In 1822, a stork was killed in Germany which had an African spear in its {{35}} .", "–  previously there had been no {{36}} that storks migrate to Africa", "Little was known about the {{37}} and journeys of migrating birds until the practice of ringing was established.", "–  It was thought large birds carried small birds on some journeys because they were considered incapable of travelling across huge {{38}} .", "–  Ringing depended on what is called the {{39}} of dead birds.", "In 1931, the first {{40}} to show the migration of European birds was printed.", "", ""], "answers": {"31": "mud", "32": "feathers", "33": "shape", "34": "moon", "35": "neck", "36": "evidence", "37": "destinations", "38": "oceans", "39": "recovery", "40": "atlas"}, "explanations": {"31": {"answer_label": "31. mud", "quote": "Take hibernation theory for example - two thousand years ago, it was commonly believed that when birds left an area, they went underwater to hibernate in the seas and oceans. Another theory for the regular appearance and disappearance of birds was that they spend winter hidden in mud", "explain": "Câu hỏi:\nIt was believed that birds hibernated underwater or buried themselves in ...\nKeywords được paraphrase:\nUnderwater - seas and oceans\nburied - hidden\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Người ta tin rằng chim ngủ đông dưới nước hoặc vùi mình trong bùn -‘mud'"}, "32": {"answer_label": "32. feathers", "quote": "He observed that in the autumn, small birds called ‘redstarts' began to lose their feathers", "explain": "Câu hỏi:\nIn autumn he observed that redstarts experience the loss of and thought they then turned into robins\nKeywords được paraphrase:\nbegan to lose - experience the loss of\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Anh ta quán sát được rằng, vào mùa thu, loài chim nhỏ được gọi là “redstarts” sẽ bị rụng lông-‘feather'"}, "33": {"answer_label": "33. shape", "quote": "These assumptions are understandable given that this pair of species are similar in shape, but are a classic example of an incorrect interpretation based on correct observations", "explain": "Câu hỏi:\nAristotle's assumptions were logical because the two species of birds had a similar...\nKeywords được paraphrase:\nLogical - understandable\npair of species - the two species of birds\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Giả định của Aristotle là hợp lý vì hai loài chim có chung hình dạng-‘shape'"}, "34": {"answer_label": "34. moon", "quote": "He wrote a surprisingly well- regarded paper claiming that birds migrate to the moon and back every year", "explain": "Câu hỏi:\nCharles Morton popularised the idea that birds fly to the ... in winter\nKeywords được paraphrase:\nPopularised the idea that - wrote a surprisingly well-regard paper claiming that\nMigrate - fly\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Charles Morton đã phổ biến ý tưởng rằng các loài chim bay mặt trăng-‘moon' vào mùa đông"}, "35": {"answer_label": "35. neck", "quote": "One of the key moments in the development of migration theory came in 1822 when a white stork was shot in Germany. This particular stork made history because of the long spear in its neck", "explain": "Câu hỏi:\nIn 1822, a stork was killed in Germany which had an African spear in its.\nKeywords được paraphrase:\nwas killed - was shot\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Một trong những thời khắc quyết định trong sự phát triển của thuyết di cư đến vào năm 1822 kh mà một con cò trắng bị bắn ở Đức. Con còn này tạo ra lịch sử vì có một cây giáo-‘spear’ dài ở cổ"}, "36": {"answer_label": "36. evidence", "quote": "This was a truly defining moment in the history of ornithology because it was the first evidence that storks spend their winters in sub-Saharan Africa", "explain": "Câu hỏi:\npreviously there had been no ... that storks migrate to Africa\nKeywords được paraphrase:\nspend their winter in sub-Saharan Africa - migrate to Africa\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn bên nói rằng, đây là một trong những phút giây quyết định nhất trong lịch sử điểu học, vì nó là một trong những bằng chứng-‘evidence’ đầu tiên là cò dành thời gian mùa đông của chúng ở khu vực châu Phi. Câu hỏi: trước đó chưa có một bằng chứng-‘evidence’ nào về việc cò di cư đến châu Phi"}, "37": {"answer_label": "37. destinations", "quote": "Before this, very little information was available about the actual destinations of particular species and how they travelled there", "explain": "Câu hỏi:\nLittle was known about the ... and journeys of migrating birds until the practice of ringing was established.\nKeywords được paraphrase:\nVery little information was available - Little was known about\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Người ta biết rất ít về địa điểm-‘destinations’ và hành trình của các loài chim di cư cho đến khi thực hành tiếng chuông được thành lập"}, "38": {"answer_label": "38.oceans", "quote": "People speculated that larger birds provided a kind of taxi service for smaller birds by carrying them on their backs. This idea came about because it seemed impossible that small birds weighing only a few grams could fly over vast oceans", "explain": "Câu hỏi:\nIt was thought large birds carried small birds on some journeys because they were considered incapable of travelling across huge\nKeywords được paraphrase:\nthat larger birds provided a kind of taxi service for smaller birds by carrying them on their backs - large birds carried small birds\nthey were considered incapable of travelling across - it seemed impossible hat small brids weighing only a few grams could fly over\nvast - huge\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Người ta cho rằng những con chim lớn mang theo những con chim nhỏ trong một số cuộc hành trình vì chúng được coi là không có khả năng đi xuyên đại dương-‘oceans' khổng lồ"}, "39": {"answer_label": "39. recovery", "quote": "The development of bird ringing, by a Danish schoolteacher, Hans Christian Cornelius Mortensen, made many discoveries possible. This is still common practice today and relies upon what is known as ‘recovery’", "explain": "Câu hỏi:\nRinging depended on what is called the ‘ ' of\ndead birds\nKey words được paraphrase:\n Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Tiếng kêu phụ thuộc vào những gì được gọi là 'sự phục hồi'-‘recovery’ của những con chim chết"}, "40": {"answer_label": "40. atlas", "quote": "Huge amounts of data were gathered in the early part of the twentieth century and for the first time in history people understood where birds actually went to in winter. In 1931, an atlas was published showing where the most common species of European birds migrated to", "explain": "relies - depended\nwhat is called - what is known as\nCâu hỏi:\nIn 1931, the first ... to show the migration of European birds was printed\nKey words được paraphrase:\nwas printed - was established\nmigration of European birds - most common species of European birds migrated to\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Năm 1931, tờ át lát-‘atlas’ đầu tiên cho thấy sự di cư của các loài chim châu Âu đã được in"}}, "script_html": "<div class=\"script-line\"><span class=\"ts\">00:00</span><span class=\"txt\">Part 4. You will hear a zoology student giving a presentation on bird migration.</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:07</span><span class=\"txt\">First you have some time to look at questions 31 to 40.</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:02</span><span class=\"txt\">Now listen carefully and answer questions 31 to 40.</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:10</span><span class=\"txt\">Scientists believe that a majority of the Earth's bird population migrate in some fashion or other.</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:16</span><span class=\"txt\">Some travel seasonally for relatively short distances, such as birds that move from their winter habitats in lowlands to mountain tops for the summers.</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:28</span><span class=\"txt\">Others, like the Arctic tern, travel more than 25,000 miles seasonally between the northern and southern poles.</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:39</span><span class=\"txt\">Bird migration has been studied over many centuries through a variety of observations,</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:44</span><span class=\"txt\">but until relatively recently, where birds went to in the winter was considered something of a mystery.</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:53</span><span class=\"txt\">The lack of modern science and technology led to many theories that we now recognize as error-filled and even somewhat amusing.</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:03</span><span class=\"txt\">Take hibernation theory for example.</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:06</span><span class=\"txt\">2,000 years ago, it was commonly believed that when birds left an area, they went underwater to hibernate in the seas and oceans.</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:18</span><span class=\"txt\">Another theory for the regular appearance and disappearance of birds was that they spent winter hidden in <mark data-q=\"31\">mud</mark> till the weather changed and food became abundant again.</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:30</span><span class=\"txt\">The theory that some birds hibernate persisted until experiments were done on caged birds in the 1940s, which demonstrated that birds have no hibernation instinct.</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:44</span><span class=\"txt\">One of the earliest naturalists and philosophers from ancient Greece was Aristotle, who was the first writer to discuss the disappearance and reappearance of some bird species at certain times of year.</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:58</span><span class=\"txt\">He developed the theory of transmutation, the seasonal change of one species into another by observing red starts and robins.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:10</span><span class=\"txt\">He observed that in the autumn, small birds called red starts began to lose their <mark data-q=\"32\">feathers</mark>, which convinced Aristotle that they changed into robins for the winter and back into red starts in the summer.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:24</span><span class=\"txt\">These assumptions are understandable, given that this pair of species are similar in <mark data-q=\"33\">shape</mark>, but are a classic example of an incorrect interpretation based on correct observations.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:40</span><span class=\"txt\">The most bizarre theory was put forward by an English amateur scientist, Charles Morton, in the 17th century.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:47</span><span class=\"txt\">He wrote a surprisingly well-regarded paper, claiming that birds migrate to the <mark data-q=\"34\">moon</mark> and back every year.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:56</span><span class=\"txt\">He came to this conclusion as the only logical explanation for the total disappearance of some species.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:08</span><span class=\"txt\">One of the key moments in the development of migration theory came in 1822, when a white stork was shot in Germany.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:18</span><span class=\"txt\">This particular stork made history because of the long spear in its <mark data-q=\"35\">neck</mark>, which, incredibly, had not killed it.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:28</span><span class=\"txt\">Everyone immediately realised this spear was definitely not European.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:34</span><span class=\"txt\">It turned out to be a spear from a tribe in Central Africa.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:38</span><span class=\"txt\">This was a truly defining moment in the history of ornithology, because it was the first <mark data-q=\"36\">evidence</mark> that storks spend their winters in sub-Saharan Africa.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:51</span><span class=\"txt\">You can still see the arrow stork in the zoological collection of the University of Rostock in Germany.</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:00</span><span class=\"txt\">People gradually became aware that European birds moved south in autumn and north in summer,</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:07</span><span class=\"txt\">but didn't know much about it until the practice of catching birds and putting rings on their legs became established.</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:16</span><span class=\"txt\">Before this, very little information was available about the actual <mark data-q=\"37\">destinations</mark> of particular species and how they travelled there.</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:24</span><span class=\"txt\">People speculated that larger birds provided a kind of taxi service for smaller birds by carrying them on their backs.</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:35</span><span class=\"txt\">This idea came about because it seemed impossible that small birds, weighing only a few grams, could fly over vast <mark data-q=\"38\">oceans</mark>.</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:44</span><span class=\"txt\">This idea was supported by observations of bird behaviour, such as the harassment of larger birds by smaller birds.</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:52</span><span class=\"txt\">The development of bird ringing by a Danish school teacher, Hans Christian Cornelius Mortensen, made many discoveries possible.</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:05</span><span class=\"txt\">This is still common practice today and relies upon what is known as <mark data-q=\"39\">recovery</mark>.</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:11</span><span class=\"txt\">This is when ringed birds are found dead in the place they have migrated to and identified.</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:18</span><span class=\"txt\">Huge amounts of data were gathered in the early part of the 20th century, and for the first time in history, people understood where birds actually went to in winter.</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:30</span><span class=\"txt\">In 1931, an <mark data-q=\"40\">atlas</mark> was published showing where the most common species of European birds migrated to.</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:39</span><span class=\"txt\">More recent theories about bird migration vary widely.</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:45</span><span class=\"txt\">That is the end of part four. You now have one minute to check your answers to part four. That is the end of the listening test.</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:55</span><span class=\"txt\">In the IELTS test, you would now have ten minutes to transfer your answers to the answer sheet.</span></div>", "script_source": "asr (Whisper transcript provided by user, answer positions located via KEY + Teacher's Book)"}]};
</script>
<script>
(function(){
  const partsEl = document.getElementById('parts');
  const tabsEl = document.getElementById('tabs');
  const state = {}; // part -> {checked:bool}

  function renderNotes(part){
    let html = '<div class="notes-block">';
    for(const rawLine of part.notes){
      const text = rawLine.trim();
      if(!text) continue;
      const isBlankLine = /\{\{\d+\}\}/.test(text);
      const isBulletLine = /^[–\-•]/.test(text);
      const isExample = /^example$/i.test(text);
      const rendered = text.replace(/\{\{(\d+)\}\}/g, (m, num) => {
        return `<span class="blank-num">${num}</span><input class="blank" type="text" data-part="${part.part}" data-q="${num}" autocomplete="off" spellcheck="false">`;
      });
      if(isExample){
        html += `<span class="subhead example-line">Example</span><br>`;
      } else if(isBlankLine){
        html += (isBulletLine ? '<span class="bullet">' : '<span>') + rendered + '</span><br>';
      } else if(isBulletLine){
        html += `<span class="bullet">${text}</span><br>`;
      } else if(text.split(' ').length <= 4){
        html += `<span class="subhead">${text}</span><br>`;
      } else {
        html += `<span class="example-line">${text}</span><br>`;
      }
    }
    html += '</div>';
    return html;
  }

  function renderMcq(part){
    let html = '';
    for(const g of part.groups){
      if(g.header){
        html += `<div class="header-note">${g.header}</div>`;
      }
      const qidsLabel = g.qids.length>1 ? `${g.qids[0]}–${g.qids[1]}` : g.qids[0];
      html += `<div class="qgroup" data-qids="${g.qids.join(',')}" data-multi="${g.multi}">`;
      html += `<div class="prompt"><span class="blank-num">${qidsLabel}</span> ${g.prompt}</div>`;
      html += '<div class="opt-list">';
      for(const [letter, text] of Object.entries(g.options)){
        const inputType = g.multi ? 'checkbox' : 'radio';
        const name = g.multi ? `p${part.part}g${g.qids.join('_')}` : `p${part.part}q${g.qids[0]}`;
        html += `<label class="opt" data-letter="${letter}"><input type="${inputType}" name="${name}" value="${letter}" ${g.multi?`data-max="${g.qids.length}"`:''}>`+
                `<span><b>${letter}.</b> ${text}</span></label>`;
      }
      html += '</div></div>';
    }
    return html;
  }

  function buildScriptHtml(part){
    // part.script_html is pre-built (server-side) HTML: escaped transcript text with
    // <mark data-q="N"> spans already placed at the answer locations. Used as-is.
    if(part.script_html) return part.script_html;
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let out = esc(part.script || '');
    out = out.replace(/\[\.\.\.\]/g, '<span class="gap">&nbsp;· · ·&nbsp;</span>');
    return out;
  }

  function buildExplanationsHtml(part){
    let html = '';
    const qids = [];
    if(part.kind === 'notes'){
      Object.keys(part.answers).sort((a,b)=>a-b).forEach(q=>qids.push(q));
    } else {
      part.groups.forEach(g=>g.qids.forEach(q=>qids.push(q)));
    }
    for(const q of qids){
      const e = part.explanations[q] || {};
      const ans = part.answers[q] || '';
      html += `<div class="expl-item"><div class="eq-head"><span class="qnum">Câu ${q}</span><span class="ans">${ans}</span></div>`;
      if(e.quote){
        html += `<div class="quote">"${e.quote.replace(/</g,'&lt;')}"</div>`;
      }
      html += `<div class="explain">${(e.explain||'').replace(/</g,'&lt;')}</div></div>`;
    }
    return html;
  }

  function gradeParts(part){
    let correct = 0, total = 0;
    if(part.kind === 'notes'){
      for(const [q, ans] of Object.entries(part.answers)){
        total++;
        const input = partsEl.querySelector(`input.blank[data-part="${part.part}"][data-q="${q}"]`);
        if(!input) continue;
        const val = input.value.trim().toLowerCase();
        const ok = val === String(ans).trim().toLowerCase();
        input.classList.remove('correct','incorrect');
        input.classList.add(ok ? 'correct' : 'incorrect');
        if(ok) correct++;
        if(!ok){
          input.title = `Correct answer: ${ans}`;
        }
      }
    } else {
      for(const g of part.groups){
        const groupEl = partsEl.querySelector(`.part[data-part="${part.part}"] .qgroup[data-qids="${g.qids.join(',')}"]`);
        if(!groupEl) continue;
        const inputs = groupEl.querySelectorAll('input');
        const correctLetters = g.qids.map(q => part.answers[q]);
        const selected = Array.from(inputs).filter(i=>i.checked).map(i=>i.value);
        groupEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
        inputs.forEach(inp=>{
          const label = inp.closest('.opt');
          const letter = label.dataset.letter;
          if(correctLetters.includes(letter)) label.classList.add('correct');
          else if(inp.checked) label.classList.add('incorrect');
        });
        if(g.multi){
          total += g.qids.length;
          const sortedSel = [...selected].sort();
          const sortedCorrect = [...correctLetters].sort();
          if(sortedSel.length===sortedCorrect.length && sortedSel.every((v,i)=>v===sortedCorrect[i])){
            correct += g.qids.length;
          } else {
            // partial credit per matched letter (order doesn't matter for these TWO-answer items)
            correctLetters.forEach(cl=>{ if(selected.includes(cl)) correct++; });
          }
        } else {
          total += 1;
          if(selected[0] === correctLetters[0]) correct += 1;
        }
      }
    }
    return {correct, total};
  }

  function renderPart(part, idx){
    const wrap = document.createElement('div');
    wrap.className = 'part' + (idx===0 ? ' active' : '');
    wrap.dataset.part = part.part;

    const card = document.createElement('div');
    card.className = 'card';
    let inner = `<div class="part-bar"><span>PART ${part.part}${part.title ? ' — ' + part.title : ''}</span><span class="title">${part.kind==='notes'?'Note Completion':'Multiple Choice'}</span></div>`;
    inner += `<div class="card-body">`;
    if(part.instructions) inner += `<div class="instructions">${part.instructions}</div>`;
    inner += `<div class="audio-box"><span class="icon">🎧</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}"></audio></div>`;
    inner += part.kind === 'notes' ? renderNotes(part) : renderMcq(part);
    inner += `<div class="actions">
        <button class="primary" data-action="check">Check Answers</button>
        <button class="ghost" data-action="reset">Reset</button>
        <span class="score-pill" data-role="score" style="display:none;"></span>
      </div>
      <div class="actions" style="margin-top:0;">
        <button class="ghost" data-action="toggle-script">Show Script</button>
        <button class="ghost" data-action="toggle-expl">Show Answers &amp; Explanations</button>
      </div>
      <div class="toggle-section" data-role="script-section">
        <h2 style="font-size:15px;color:var(--navy);">Audio Script — Part ${part.part}</h2>
        <div class="audio-box"><span class="icon">🎧</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}"></audio></div>
        <div class="script-text">${buildScriptHtml(part)}</div>
      </div>
      <div class="toggle-section" data-role="expl-section">
        <h2 style="font-size:15px;color:var(--navy);">Answers &amp; Explanations — Part ${part.part}</h2>
        ${buildExplanationsHtml(part)}
      </div>
      </div>`;
    card.innerHTML = inner;
    wrap.appendChild(card);

    // Enforce "choose exactly N" on multi-select (checkbox) question groups: once N
    // boxes are checked, the rest are disabled until one is unchecked again.
    card.querySelectorAll('.qgroup[data-multi="true"]').forEach(groupEl => {
      const boxes = Array.from(groupEl.querySelectorAll('input[type="checkbox"]'));
      if(!boxes.length) return;
      const max = parseInt(boxes[0].dataset.max, 10) || 2;
      const sync = () => {
        const checkedCount = boxes.filter(b=>b.checked).length;
        boxes.forEach(b => { if(!b.checked) b.disabled = checkedCount >= max; });
      };
      boxes.forEach(b => b.addEventListener('change', sync));
    });

    card.querySelector('[data-action="check"]').addEventListener('click', () => {
      const {correct, total} = gradeParts(part);
      const pill = card.querySelector('[data-role="score"]');
      pill.style.display = 'inline-block';
      pill.textContent = `Score: ${correct} / ${total}`;
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.add('done');
    });
    card.querySelector('[data-action="reset"]').addEventListener('click', () => {
      card.querySelectorAll('input[type="text"]').forEach(i=>{i.value='';i.classList.remove('correct','incorrect');i.title='';});
      card.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(i=>{i.checked=false;i.disabled=false;});
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
      card.querySelector('[data-role="score"]').style.display='none';
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.remove('done');
    });
    card.querySelector('[data-action="toggle-script"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="script-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Script' : 'Show Script';
    });
    card.querySelector('[data-action="toggle-expl"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="expl-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
    });

    return wrap;
  }

  TEST_DATA.parts.forEach((part, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (idx===0 ? ' active' : '');
    tabBtn.dataset.tab = part.part;
    tabBtn.innerHTML = `<span class="dot"></span>Part ${part.part}`;
    tabBtn.addEventListener('click', () => {
      // Stop any audio still playing before switching parts (in the part being left
      // AND in the one being entered, in case it was left mid-playback earlier).
      partsEl.querySelectorAll('audio').forEach(a => { a.pause(); });
      tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      partsEl.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));
      tabBtn.classList.add('active');
      partsEl.querySelector(`.part[data-part="${part.part}"]`).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    tabsEl.appendChild(tabBtn);
    partsEl.appendChild(renderPart(part, idx));
  });
})();
</script>
</body>
</html>
