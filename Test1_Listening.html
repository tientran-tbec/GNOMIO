<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 1 – IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:6px 4px;max-height:520px;overflow-y:auto;}
.script-text .gap{color:var(--muted);font-style:italic;}
.script-text mark{background:#ffe392;padding:1px 3px;border-radius:3px;font-weight:700;box-shadow:0 0 0 1px #f0c85f;}
.script-line{display:flex;gap:12px;align-items:baseline;padding:6px 14px;border-radius:7px;line-height:1.65;}
.script-line:hover{background:#eef2fb;}
.script-line:has(mark){background:#fffaf0;}
.script-line .ts{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border-radius:5px;padding:2px 7px;min-width:44px;text-align:center;}
.script-line .txt{flex:1 1 auto;color:var(--ink);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="kicker">Flight to Success</span>
    <h1>Test 1 — IELTS Listening</h1>
    <p>4 parts · 40 questions · Listen to each part, answer, then check your results, script and explanations.</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="parts"></div>
  <footer class="credit">Flight to Success — Listening Practice</footer>
</div>
<script>
const TEST_DATA = {"test": "Test 1", "parts": [{"part": 1, "audio": "Test1_Listening_audio/part1.m4a", "title": "Flanders Conference Hotel", "instructions": "Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.", "kind": "notes", "notes": ["Example", "Customer Services Manager: ........................................................................................", "Date available", "weekend beginning February 4th", "Conference facilities", "the {{1}} room for talks", "(projector and {{2}} available)", "area for coffee and an {{3}}", "free {{4}} throughout", "a standard buffet lunch costs {{5}} per head", "Accommodation", "Rooms will cost {{6}} including breakfast.", "Other facilities", "The hotel also has a spa and rooftop {{7}} .", "There's a free shuttle service to the {{8}} .", "Location", "Wilby Street (quite near the {{9}} )", "near to restaurants and many {{10}}"], "answers": {"1": "Tesla", "2": "microphone", "3": "exhibition", "4": "wifi", "5": "45", "6": "135", "7": "pool", "8": "airport", "9": "sea", "10": "clubs"}, "explanations": {"1": {"answer_label": "Câu 1", "quote": "Man: OK. Now can you tell me a bit about what conference facilities you have?\n\nAngela: Sure. So for talks and presentations we have the Tesla room.\n\nMan: Sorry?\n\nAngela: Tesla -that's spelled T-E- S-L-A.", "explain": "Câu hỏi:\nConference facilities\n• the 1 room for talks\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “conference facilities” (cơ sở vật chất cho hội nghị). Đáp án cần điền là một danh từ chỉ về “room for talks” (phòng để đàm thoại).\nGiải thích đáp án:\nGiọng nam đưa ra câu hỏi “what conference facilities you have?” (bạn có cơ sở vật chất nào cho hội nghị?). Giọng nữ trả lời ngay sau đó “for talks and presentations we have the Tesla room” (để đàm thoại và trình bày, chúng tôi có phòng Tesla). Vì đây là một tên riêng của căn phòng, sau đó người nữ đã đánh vần từ Tesla."}, "2": {"answer_label": "Câu 2", "quote": "ANGELA: Tesla (Q1) - that's spelled T-E-S-L-A. It holds up to a hundred people, and it's fully equipped with a projector and so on.\n\nMAN: How about a microphone? (Q2)\n\nANGELA: Yes, that'll be all set up ready for you, and there'll be one that members of the audience can use too, for questions, if necessary.", "explain": "Câu hỏi:\nConference facilities\n• the 1 room for talks\n(projector and 2 available)\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “conference facilities” (cơ sở vật chất cho hội nghị). Đáp án cần điền là một danh từ chỉ đồ vật, bởi trước đó ta có danh từ “projector and...” (máy chiếu và...).\nGiải thích đáp án:\nSau khi đánh vần tên căn phòng Telsa, người phụ nữ giới thiệu “it's fully equipped with a projector” (nó được trang bị đầy đủ với máy chiếu). Người đàn ông hỏi tiếp “How about a microphone?” (Còn mi-cro thì sao?). Cuối cùng, giọng nữ xác nhận “Yes, that'll be all set up ready for you.” (vâng, nó cũng sẽ được lắp sẵn cho bạn). Vì vậy, đáp án cần điền ở đây là “microphone”."}, "3": {"answer_label": "Câu 3", "quote": "Fine. And we'll also need some sort of open area where people can sit and have a cup of coffee, and we'd like to have an exhibition of our products and services there as well, so that'll need to be quite a big space.", "explain": "Câu hỏi:\n• area for coffee and an 3 \nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “conference facilities” (cơ sở vật chất cho hội nghị). Dịch phần câu hỏi “area for coffee and an...” (khu vực có cà phê và một...) Vì vậy, đáp án ở đây sẽ là một danh từ đếm được số ít.\nGiải thích đáp án:\nNgười đàn ông đưa ra vế đầu tiên của câu hỏi “we'll also need some sort of open area where people can sit and have a cup of coffee” (chúng tôi cũng cần một khu vực mở nơi mọi người có thể ngồi và uống cà phê). Sau đó, ông đưa ra yêu cầu tiếp theo\nwe'd like to have an exhibition of our products” (chúng tôi muốn có một buổi triển lãm những sản phẩm). Do đó, đáp án cần điền ở đây là “exhibition”."}, "4": {"answer_label": "Câu 4", "quote": "“MAN: Great. And I presume there’s wifi?\n\nANGELA: Oh yes, that’s free and available throughout the\nhotel\n\nMAN: OK.", "explain": "Câu hỏi:\n•free 4 throughout\nKeywords được paraphrase:\nChỗ trống cần điền là một danh từ bởi\ntrước đó là tính từ “free” (miễn phí) và sau\nđó là trạng từ “throughout” (xuyên suốt).\nGiải thích đáp án:\nNgười đàn ông, đưa ra câu hỏi “I presume there’s wifi?” (tôi đoán là có wifi chứ?). Người phụ nữ xác nhận lại “Oh yes, that’s free and available throughout the hotel.” (Vâng, nó miễn phí và phủ sóng toàn khách sạn). Vì vậy, đáp án ở đây là “wifi”."}, "5": {"answer_label": "Câu 5", "quote": "ANGELA: Would you also like us to provide a buffet lunch? We can do a two-course meal with a number of different options.\nMAN: What sort of price are we looking at for that?\nANGELA: Well, I can send you the copy of the standard menu. That’s $45 (Q5) per person. Or you can have the special for $25 more.\nMAN: I think the standard should be OK, but yes, send me the\nmenu.", "explain": "Câu hỏi:\n• a standard buffet lunch costs 5 $ per head\nKeywords được paraphrase:\nCâu hỏi hỏi về giá tiền của “a standard buffet lunch” (tiệc đứng buổi trưa tiêu chuẩn).\nGiải thích đáp án:\nNgười phụ nữ đưa ra câu hỏi “Would you also like us to provide a buffet lunch?” (Bạn có muốn chúng tôi cung cấp tiệc đứng buổi trưa?). Người đàn ông tiếp tục\nhỏi về thông tin bữa tiệc đứng “What sort of price are we looking at for that?” (có những loại giá nào?). Người phụ nữ giới thiệu “the standard menu. That's $45 per person.” (menu tiêu chuẩn. Nó có giá 45 đô mỗi người). Vì vậy, ta cần điền 45 ở đây."}, "6": {"answer_label": "Câu 6", "quote": "MAN: Now we're also going to need accommodation on the Saturday night for some of the participants ... I'm not sure how many, but probably about 25. So what do you charge for a room?\n\nANGELA: Well, for conference attendees we have a 25% reduction, so we can offer you rooms at $135. Normally a standard room's $180. (Q6)", "explain": "Câu hỏi:\nAccommodation\n• Rooms will cost 6$ including\nbreakfast.\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “accommodation” (phòng ở). Giá tiền cần điền dành cho “rooms ... including breakfast” (phòng bao gồm bữa sáng).\nGiải thích đáp án:\nĐầu tiên, người đàn ông đưa ra câu hỏi về phòng ở “What do you charge for a room?” (Bạn tính tiền một phòng bao nhiêu?). Sau đó, người phụ nữ đưa ra khá nhiều con số, ta cần lưu ý nghe kỹ. “We have a 25% reduction, so we can offer you rooms at $135.” (chúng tôi có giảm giá 25%, vì vậy giá phòng của bạn là 135 đô). Do đó, ở đây ta điền số 135."}, "7": {"answer_label": "Câu 7", "quote": "ANGELA: Sure. And of course, guests can also make use of all the other facilities at the hotel. So we've got a spa where you can get massages and facials and so on, and there's a pool up on the roof for the use of guests. (Q7)", "explain": "Câu hỏi:\nOther facilities\n• The hotel also has a spa and rooftop\n7………………………..\n• There's a free shuttle service to the\n8 ……………………….\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “other facilities” (cơ sở vật chất khác). Phần đáp án cần điền là một danh từ chỉ địa điểm bởi trước đó ta có cụm từ “a spa and rooftop ...” (một spa và nơi ... nằm trên mái nhà).\nGiải thích đáp án:\nNgười phụ nữ dẫn vào câu hỏi bằng câu nói “guests can also make use of all the other facilities at the hotel.” (khách có thể dùng các cơ sở vật chất khác ở khách sạn). Sau đó, người phụ nữ giới thiệu các cơ sở vật chất “we've got a spa...and there's a pool up on the roof” (chúng tôi có một spa..và một cái hồ bơi ở trên mái nhà). Vì vậy, đáp án ở đây là “pool”."}, "8": {"answer_label": "Câu 8", "quote": "MAN: Great. Now what about transport links? The hotel's downtown, isn't it?\nANGELA: Yes, it's about 12 kilometres from the airport (Q8), but there's a complimentary shuttle bus for guests. And it's only about ten minutes' walk from the central railway station.", "explain": "Câu hỏi:\nOther facilities\n• The hotel also has a spa and rooftop\n7 …………………………………………………\n• There's a free shuttle service to the\n8 ………………………………………………… \nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “other facilities” (cơ sở vật chất khác). Phần đáp án cần điền là một danh từ chỉ địa điểm vì trước đó ta có cụm từ “there's a free shuttle service to the...” (có một dịch vụ tàu miễn phí đến.).\nGiải thích đáp án:\nNgười đàn ông chuyển sang vấn đề giao thông bằng câu hỏi “what about transport links?” (còn về mạng lưới giao thông như thế nào?). Người phụ nữ đưa ra câu trả lời “it's about 12 kilometers from the airport. But there's a complimentary shuttle bus for guests.” (khoảng 12 cây số từ sân bay, nhưng có một xe buýt tăng cường cho khách). Ở đây, chữ “complimentary” được thay cho chữ “free”, vì vậy đáp án cần điền là “airport”."}, "9": {"answer_label": "Câu 9", "quote": "ANGELA:Well, it's downtown on Wilby Street, that's quite a small street, and it's not very far from the sea (Q9). And of course if the conference attendees want to go out on the Saturday evening there's a huge choice of places to eat. Then if they want to make a night of it, they can go on to one of the clubs (Q10) in the area - there are a great many to choose from.", "explain": "Câu hỏi:\nLocation\n• Wilby Street (quite near the 9 )\n• near to restaurants and many\n10 \nKeywords được paraphrase:\nCâu hỏi nằm trong phần “location” (địa điểm). Tên riêng Wilby Street được đưa ra trong câu hỏi, sau đó ta cần điền một danh từ chỉ địa điểm bởi trước đó có cụm từ “quite near the...” (khá gần...).\nGiải thích đáp án:\nNgười phụ nữ nhắc đến tên riêng Wilby Street để báo hiệu câu trả lời nằm ngay sau đó. Ta nghe câu “it's not very far from the sea” (nó không quá xa từ biển) tức là nó gần biển. Vì vậy, đáp án cần điền là “sea”."}, "10": {"answer_label": "Câu 10", "quote": "ANGELA:Well, it's downtown on Wilby Street, that's quite a small street, and it's not very far from the sea (Q9). And of course if the conference attendees want to go out on the Saturday evening there's a huge choice of places to eat. Then if they want to make a night of it, they can go on to one of the clubs (Q10) in the area - there are a great many to choose from.", "explain": "Câu hỏi:\nLocation\n• Wilby Street (quite near the 9 )\n• near to restaurants and many\n10 \nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “location” (địa điểm). Ở đây, ta cần điền một danh từ chỉ nơi chốn ở dạng số nhiều vì trước đó có cụm từ “near to restaurants and many...” (gần các nhà hàng và nhiều...).\nGiải thích đáp án:\nNgười phụ nữ đưa ra câu đồng nghĩa với “restaurants” trong câu hỏi là “there's a huge choice of places to eat” (có nhiều sự lựa chọn địa điểm để ăn). Sau đó, người nói tiếp tục đưa ra ý tiếp theo “if they want to make a night of it, they can go to one of the clubs” (nếu họ muốn đi chơi đêm, họ có thể đến một trong những câu lạc bộ). Ở đây, chỉ có danh từ “clubs” phù hợp về nghĩa và loại từ để điền vào đáp án."}}, "script_html": "<div class=\"script-line\"><span class=\"ts\">00:01</span><span class=\"txt\">IELTS 14 tests 1 to 4 published by Cambridge University Press and</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:10</span><span class=\"txt\">UCLSS 2019 this recording is copyright test 3 you will hear a number of</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:21</span><span class=\"txt\">different recordings and you will have to answer questions on what you</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:26</span><span class=\"txt\">hear there will be time for you to read the instructions and questions and you</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:32</span><span class=\"txt\">will have a chance to check your work all the recordings will be played once</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:39</span><span class=\"txt\">only the test is in four sections at the end of the test you will be given</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:48</span><span class=\"txt\">ten minutes to transfer your answers to an answer sheet now turn to section</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:56</span><span class=\"txt\">one section one you will hear a man phoning the customer services manager of</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:09</span><span class=\"txt\">a hotel to get information about holding a</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:12</span><span class=\"txt\">conference there first you have some time to look at</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:17</span><span class=\"txt\">questions one to five you will see that there is an example that has been</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:47</span><span class=\"txt\">done for you on this occasion only the conversation relating to this will be</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:54</span><span class=\"txt\">played first hello Flanders Conference Hotel oh hi I wanted to ask about</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:04</span><span class=\"txt\">conference facilities at the hotel have I come through to the right person</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:08</span><span class=\"txt\">mm-hmm you have under customer services manager my name is Angela the</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:17</span><span class=\"txt\">name of the customer services manager is Angela so Angela has been written in</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:23</span><span class=\"txt\">the space now we shall begin you should answer the questions as you</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:31</span><span class=\"txt\">listen because you will not hear the recording a second time</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:36</span><span class=\"txt\">listen carefully and answer questions one to five</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:44</span><span class=\"txt\">hello Flanders Conference Hotel oh hi I wanted to ask about conference</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:50</span><span class=\"txt\">facilities at the hotel have I come through to the right person mm-hmm you</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:55</span><span class=\"txt\">have under customer services manager my name is Angela so how can I help you</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:01</span><span class=\"txt\">well I'm calling from Barrett and Stanson's we're a medical company</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:05</span><span class=\"txt\">based in Perth oh yes and we're organizing a conference for our</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:10</span><span class=\"txt\">clients to be held in Sydney it'll be held over two days and we're</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:14</span><span class=\"txt\">expecting about 50 or 60 people when were you thinking of having it sometime</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:20</span><span class=\"txt\">early next year like the end of January it'd have to be a weekend let me</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:26</span><span class=\"txt\">see our conference facilities are already booked for the weekend</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:32</span><span class=\"txt\">beginning January the 28th we could do the first weekend in February how</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:39</span><span class=\"txt\">about January the 21st oh I'm afraid that spoke to well let's go for the</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:47</span><span class=\"txt\">February date then so that's the weekend beginning the fourth okay now can</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:54</span><span class=\"txt\">you tell me a bit about what conference facilities you have sure so</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:00</span><span class=\"txt\">for talks and presentations we have the <mark data-q=\"1\">Tesla</mark> room sorry Tesla that</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:06</span><span class=\"txt\">spelled t-e-s-l-a it holds up to a hundred people and it's fully equipped</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:15</span><span class=\"txt\">with a projector and so on how about a <mark data-q=\"2\">microphone</mark> yes that'll be all set up</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:22</span><span class=\"txt\">ready for you and there'll be one that members of the audience can use too for</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:27</span><span class=\"txt\">questions if necessary fine and we'll also need some sort of open area where</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:33</span><span class=\"txt\">people can sit and have a cup of coffee and we'd like to have an</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:37</span><span class=\"txt\"><mark data-q=\"3\">exhibition</mark> of our products and services there as well so that'll need to</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:42</span><span class=\"txt\">be quite a big space mm-hmm that's fine there's a central atrium with all</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:49</span><span class=\"txt\">those facilities and you can come before the conference starts if you want</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:53</span><span class=\"txt\">to set everything up great and I presume this <mark data-q=\"4\">Wi-Fi</mark> oh yes that's free</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:00</span><span class=\"txt\">and available throughout the hotel okay would you also like us to provide a</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:06</span><span class=\"txt\">buffet lunch we can do a two-course meal with a number of different</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:11</span><span class=\"txt\">options what sort of price are we looking out for that well I can send</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:16</span><span class=\"txt\">you a copy of this standard menu that's <mark data-q=\"5\">$45</mark> per person or you can have the</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:23</span><span class=\"txt\">special for $25 more I think the standard should be okay but yes send</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:30</span><span class=\"txt\">me the menu before you hear the rest of the conversation you have some time</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:38</span><span class=\"txt\">to look at questions 6 to 10 now listen and answer questions 6 to 10 now we're</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:13</span><span class=\"txt\">also going to need accommodation on the Saturday night for some of the</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:18</span><span class=\"txt\">participants I'm not sure how many but probably about 25 so what do you</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:24</span><span class=\"txt\">charge for a room well for conference attendees we have a 25% reduction so we</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:31</span><span class=\"txt\">can offer you rooms at <mark data-q=\"6\">$135</mark> normally a standard rooms $180 and does that</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:40</span><span class=\"txt\">include breakfast sure and of course guests can also make use of all the</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:46</span><span class=\"txt\">other facilities at the hotel so we've got a spa where you can get massages</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:51</span><span class=\"txt\">and facials and so on and there's a <mark data-q=\"7\">pool</mark> up on the roof for the use of</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:57</span><span class=\"txt\">guests oh great now what about transport links the hotels downtown</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:04</span><span class=\"txt\">isn't it yes it's about 12 kilometers from the <mark data-q=\"8\">airport</mark> but there's a</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:09</span><span class=\"txt\">complimentary shuttle bus for guests and it's only about 10 minutes walk</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:14</span><span class=\"txt\">from this central railway station okay now I don't know Sydney very well can</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:20</span><span class=\"txt\">you just give me an idea of the location of the hotel ah well it's</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:25</span><span class=\"txt\">downtown on Wilby Street that's quite a small street and it's not very far</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:32</span><span class=\"txt\">from the <mark data-q=\"9\">sea</mark> and of course if the conference attendees want to go out on</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:37</span><span class=\"txt\">this Saturday evening there's a huge choice of places to eat then if they</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:43</span><span class=\"txt\">want to make a night of it they can go on to one of the <mark data-q=\"10\">clubs</mark> in the</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:47</span><span class=\"txt\">area there are a great many to choose from okay so if we go ahead with this</span></div>\n<div class=\"script-line\"><span class=\"ts\">07:55</span><span class=\"txt\">can you give me some information about how much we're looking at that is</span></div>\n<div class=\"script-line\"><span class=\"ts\">08:02</span><span class=\"txt\">the end of section 1 you now have half a minute to check your answers now</span></div>\n<div class=\"script-line\"><span class=\"ts\">08:39</span><span class=\"txt\">turn to section 2</span></div>", "script_source": "asr (Whisper transcript provided by user, answer positions located via KEY + Teacher's Book)"}, {"part": 2, "audio": "Test1_Listening_audio/part2.m4a", "kind": "mcq", "groups": [{"qids": ["11"], "prompt": "When did the Street Play Scheme first take place?", "options": {"A": "two years ago", "B": "three years ago", "C": "six years ago"}, "multi": false, "header": "Questions 11-16 Choose the correct letter, A, B or C."}, {"qids": ["12"], "prompt": "How often is Beechwood Road closed to traffic now?", "options": {"A": "once a week", "B": "on Saturdays and Sundays", "C": "once a month"}, "multi": false, "header": null}, {"qids": ["13"], "prompt": "Who is responsible for closing the road?", "options": {"A": "a council official", "B": "the police", "C": "local wardens"}, "multi": false, "header": null}, {"qids": ["14"], "prompt": "Residents who want to use their cars", "options": {"A": "have to park in another street.", "B": "must drive very slowly.", "C": "need permission from a warden."}, "multi": false, "header": null}, {"qids": ["15"], "prompt": "Alice says that Street Play Schemes are most needed in", "options": {"A": "wealthy areas.", "B": "quiet suburban areas.", "C": "areas with heavy traffic."}, "multi": false, "header": null}, {"qids": ["16"], "prompt": "What has been the reaction of residents who are not parents?", "options": {"A": "Many of them were unhappy at first.", "B": "They like seeing children play in the street.", "C": "They are surprised by the lack of noise."}, "multi": false, "header": null}, {"qids": ["17", "18"], "prompt": "Which TWO benefits for children does Alice think are the most important?", "options": {"A": "increased physical activity", "B": "increased sense of independence", "C": "opportunity to learn new games", "D": "opportunity to be part of a community", "E": "opportunity to make new friends"}, "multi": true, "header": "Questions 17 and 18 Choose TWO letters, A-E."}, {"qids": ["19", "20"], "prompt": "Which TWO results of the King Street experiment surprised Alice?", "options": {"A": "more shoppers", "B": "improved safety", "C": "less air pollution", "D": "more relaxed atmosphere", "E": "less noise pollution"}, "multi": true, "header": "Questions 19 and 20 Choose TWO letters, A-E."}], "answers": {"11": "B", "12": "A", "13": "C", "14": "B", "15": "C", "16": "B", "17": "B", "18": "D", "19": "A", "20": "E"}, "explanations": {"11": {"answer_label": "11. B", "quote": "ALICE: Well, I first had the idea when my oldest child was still a toddler, so that's about six years ago now — but it took at least two years of campaigning before we were actually able to make it happen. So the scheme's been up and running for three years now. We'd love to be able to close our road for longer — for the whole …", "explain": "Câu hỏi: \n11. When did the Street Play Scheme first take place? \nA two years ago \nB three years ago \nC six years ago \nKeywords được paraphrase: \nTa cần gạch dưới các từ khóa “When” (khi nào) “Street Play Scheme” và “first take place” (diễn ra lần đầu tiên). Ta có thể thấy “first take place” được paraphrase lại trong bài bằng “has been up and running for” (đã bắt đầu và hoạt động trong). \nGiải thích đáp án: \nTrong bài, sau khi Alice được hỏi “When did you actually start the scheme?” (Bạn đã bắt đầu kế hoạch này khi nào?). Ta nghe được đoạn “the scheme’s been up and running for three years now” (Chương trình đã bắt và hoạt động được ba năm cho đến hiện tại). Như vậy B là đáp án. \nNgoài ra, trước đoạn này, ta cũng có nghe về những mốc thời gian khác ứng với các sự kiện mà Alice trình bày, tuy nhiên không phải là mốc thời gian bắt đầu của “Street Play Scheme”. Điển hình như “I first had the idea … six years ago” (tôi có ý tưởng này lần đầu … 6 năm về trước); “It took two years of campaigning...” (Nó mất 2 năm vận động chiến dịch…)."}, "12": {"answer_label": "12. A", "quote": "three years now. We'd love to be able to close our road for longer — for the whole weekend, from Saturday morning until Sunday evening, for example. At the moment it's just once a week. But when we started it was only once a month. But we're working on it.", "explain": "Câu hỏi: \n12. How often is Beechwood Road closed to traffic now? \nA once a week \nB on Saturdays and Sundays \nC once a month \nKeywords được paraphrase: \nTa cần chú ý vào từ hỏi “How often” (hỏi độ thường xuyên) ; “closed to traffic” (đóng cửa giao thông) và đặc biệt là “now” (ở hiện tại). Từ khóa “now” xuất hiện trong câu hỏi giúp ta xác định thì của câu chứa thông tin trong bài phải là thì hiện tại. \nGiải thích đáp án: \nTrong bài nghe, có đoạn “At the moment, It’s just once a week” (Ở thời điểm hiện tại, nó chỉ là một lần một tuần). “at the moment” có nghĩa tương đương với “now” trên câu hỏi.\nVì vậy ta chọn đáp án A."}, "13": {"answer_label": "13. C", "quote": "ALICE: We have volunteer wardens, mostly parents but some elderly residents too, who block off our road at either end. The council have provided special signs but there's always a\nvolunteer there to explain what's\nhappening to any motorists. Generally, they're fine about it — we've only had to get the police involved once or twice.", "explain": "Câu hỏi:\n13. Who is responsible for closing the road?\nA a council official\nB the police\nC local wardens\nKeywords được paraphrase:\n“responsible for” (chịu trách nhiệm làm gì) được thay bằng cấu trúc “have sb do something” (có ai đó làm gì). Ngoài ra, “closing” (đóng) cũng được thay bằng “block off” (chặn) trong bài nghe.\nGiải thích đáp án:\nTrong bài nghe, ta nghe được “We have volunteer wardens,…. who block off our road at either end” (Chúng tôi có những người trông coi tình nguyện, những người mà sẽ chặn những con đường ở 2 đầu). Như vậy đáp án là C. Ngoài ra ta cũng nghe được những vị trí khác\nứng với các đáp án A và B. Nhưng trách nhiệm của họ không phải là “closing the road”. Điển hình có “The council have provided special signs” (Hội đồng đã cung cấp những biển báo đặc biệt); “explain what’s happening to…, get the police involved” (giải thích những gì đang diễn ra cho …. gọi cảnh sát tham gia vào)."}, "14": {"answer_label": "14. B", "quote": "Now I should explain that the road isn't completely closed to cars. But only residents' cars are allowed. If people really need to get in or out of Beechwood Road, it's not a problem — as long as they drive at under 20 kilometres per hour.", "explain": "Câu hỏi:\n14. Residents who want to use their cars\nA have to park in another street.\nB must drive very slowly.\nC need permission from a warden. \nKeywords được paraphrase: \nTa cần gạch chân các từ khóa “residents” (cư dân) “use” (sử dụng) và “cars” (ô tô) để hiểu rõ nội dung câu hỏi và xác định được vị trí của câu hỏi trong bài nghe. \nGiải thích đáp án: \nTrong bài nghe, có đoạn “isn’t completely closed to cars” (không đóng hoàn toàn đối với ô tô); “only residents’ cars are allowed” (Chỉ có xe hơi của cư dân trong khu vực là được cho phép); “if people really need to get in or out, it’s not a problem” (Nếu người ta - cư dân muốn đi vào hoặc ra thì không vấn đề gì) ; “as long as they drive at under 20 kilometres per hour” (miễn là họ lái dưới 20km/h) . Như vậy ta chọn đáp án B."}, "15": {"answer_label": "15. C", "quote": "ALICE: Absolutely — we want to include all kids in the city — especially those who live on busy roads. It's here that demand is greatest. Obviously, there isn't such demand in wealthier areas where the children have access to parks or large gardens — or in the suburbs where there are usually more places for children to play outside.", "explain": "Câu hỏi: \n15. Alice says that Street Play Schemes are most needed in \nA wealthy areas. \nB quiet suburban areas. \nC areas with heavy traffic. \nKeywords được paraphrase: \nKeyword “are needed” được thay bằng “demand” (nhu cầu) trong bài nghe. \nGiải thích đáp án: \nTrong bài, ta nghe được “We want to include all kids in the city - especially those who live on busy roads. It’s here that the demand is greatest” (Chúng tôi muốn bao gồm tất cả trẻ em trong thành phố, nhất là những đứa mà sống trên những con đường tấp nập. Chính là ở đó mà nhu cầu là lớn nhất). Ta có thể thấy “busy roads” (những con đường tấp nập) đồng nghĩa với “areas with heavy traffic” (những khu vực mà có giao thông dày đặc) trong câu C. Vì vậy, ta chọn đáp án C. \nNgoài ra, tiếp sau đó, ta có thể nghe được những thông tin liên quan đến các lựa chọn còn lại, tuy nhiên chúng không phải là nơi có nhu cầu lớn nhất theo như yêu cầu câu hỏi “most needed” . Vì vậy ta loại các đáp án này."}, "16": {"answer_label": "16. B", "quote": "", "explain": "Câu hỏi: \n16. What has been the reaction of residents who are not parents? \nA Many of them were unhappy at first. \nB They like seeing children play in the street. \nC They are surprised by the lack of noise. \nKeywords được paraphrase: \nCác keyword quan trọng cần gạch chân là “reaction” (phản ứng) và “residents who are not parents” (những người dân mà không phải là các bậc phụ huynh). \nGiải thích đáp án: \nTrong bài, ta nghe được “everyone is very supportive and say they’re very happy to see children out on the street” (mọi người đều rất ủng hộ và nói rằng họ rất vui khi thấy trẻ em trên đường phố). “be happy to” (rất vui khi) đồng nghĩa với “like” (thích) ở câu B. Vì vậy, ta chọn đáp án B."}, "17": {"answer_label": "17. B & D", "quote": "but for me the biggest advantage is that kids develop confidence in themselves to be outside without their parents. The other really fantastic thing is that children get to know the adults in the street — it's like having a big extended family.", "explain": "Câu hỏi: \nQuestions 17 and 18 Choose TWO letters, A-E. Which TWO benefits for children does Alice think are the most important? \nA increased physical activity \nB increased sense of independence\nC opportunity to learn new games \nD opportunity to be part of a community \nE opportunity to make new friends \nKeywords được paraphrase: \nTa cần tập trung vào các keywords “Benefits” (lợi ích); “Alice think” và “most important” (quan trọng nhất) để nắm rõ thông tin cần nghe. Trong bài nghe, những keyword này được thể hiện qua câu “But for me the biggest advantage is” (nhưng đối với tôi, lợi ích lớn nhất là …). \nGiải thích đáp án: \nSau khi xác định vị trí của câu hỏi 17 và 18 qua cụm từ “for me the biggest advantage is”, ta nghe được “kids develop confidence in themselves to be outside without their parents” (Những đứa trẻ phát triển sự tự tin trong bản thân chúng khi ra ngoài mà không có ba mẹ). Ý của câu này hướng về câu B “increased sense of independence” (cảm giác tự lập được tăng lên). Như vậy lợi ích đầu tiên ta nghe được là B."}, "18": {"answer_label": "18. B & D", "quote": "but for me the biggest advantage is that kids develop confidence in themselves to be outside without their parents. The other really fantastic thing is that children get to know the adults in the street — it's like having a big extended family.", "explain": "Câu hỏi: \nQuestions 17 and 18 Choose TWO letters, A-E. \nWhich TWO benefits for children does Alice think are the most important? \nA increased physical activity \nB increased sense of independence \nC opportunity to learn new games \nD opportunity to be part of a community \nE opportunity to make new friends \nKeywords được paraphrase: \nTa cần tập trung vào các keywords “Benefits” (lợi ích); “Alice think” và “most \nimportant” (quan trọng nhất) để nắm rõ thông tin cần nghe. Trong bài nghe, những keyword này được thể hiện qua câu “But for me the biggest advantage is” (nhưng đối với tôi, lợi ích lớn nhất là …). \nGiải thích đáp án: \nSau đó, Alice chuyển sang lợi ích thứ 2 bằng cách nói “The other really fantastic thing is” (Một điều nữa khá tuyệt vời là…). Sau đó, cô ấy nói “Children get to know the adults in the street - it’s like having a big extended family” (Trẻ em có thể làm quen với những người lớn trong phố - nó giống như thể có một gia đình to lớn vậy). Ý của câu này hướng về lựa chọn D “opportunity to be part of a community” (cơ hội để trở thành một phần của cộng đồng). Rõ ràng những đứa trẻ khi quen biết được những người lớn sống trong cùng khu vực có thể trở thành một phần của một cộng đồng lớn hơn. Như vậy ta chọn đáp án D."}, "19": {"answer_label": "19. A & E", "quote": "It was surprising how much of a difference all this made. As we'd predicted, air quality was significantly better but what I hadn't expected was how much quieter it would be — even with the buses still running. Of course everyone said they felt safer but we were actually amazed that sales in the shops went up considerably that day — we thought there'd be fewer people out shopping — not more.", "explain": "Câu hỏi: \nQuestions 19 and 20 Choose TWO letters, A—E. \nWhich TWO results of the King Street experiment surprised Alice? \nA more shoppers \nB improved safety \nC less air pollution \nD more relaxed atmosphere \nE less noise pollution \nKeywords được paraphrase: \nCần gạch dưới “King Street experiment” vì đây là đối tượng chính của câu hỏi giúp mình xác định được vị trí của câu hỏi trong bài nghe. Ngoài ra cũng chú ý đến keyword \n“results” (kết quả) và “surprised Alice” (làm Alice ngạc nhiên). Như vậy, ta chỉ tập trung vào những kết quả mà làm Alice ngạc nhiên. \nTrong bài “surprised” (làm ngạc nhiên) được paraphrase lại thành các cụm từ “hadn’t expected” (không ngờ đến được) và “were amazed” (rất ngạc nhiên). \nGiải thích đáp án: \nĐoạn thông tin liên quan đến câu hỏi bắt đầu khi Alice nói “It was surprising how much of a difference all this made” (Thật ngạc nhiên làm sao về những sự khác biệt mà tất cả những việc này tạo ra). Sau đó ta nghe được “What I hadn’t expected was how much quieter it would be” (Điều mà tôi đã không ngờ đến được là việc mọi thứ trở nên yên tĩnh hơn như thế nào). Thông tin này hướng về lựa chọn E “less noise pollution” (ít ô nhiễm tiếng ồn hơn). Như vậy đáp án đầu tiên mà ta chọn được là E. \nNgoài ra, trước đó ta nghe được “air quality was…better” (Chất lượng không khí tốt hơn) nhưng ta không chọn lựa chọn C vì kết quả này đã được biết trước “As we’d predicted” (Giống như những gì chúng tôi đã liệu trước)."}, "20": {"answer_label": "20. A & E", "quote": "It was surprising how much of a difference all this made. As we'd predicted, air quality was significantly better but what I hadn't expected was how much quieter it would be — even with the buses still running. Of course everyone said they felt safer but we were actually amazed that sales in the shops went up considerably that day — we thought there'd be fewer people out shopping — not more.", "explain": "Câu hỏi: \nQuestions 19 and 20 Choose TWO letters, A—E. \nWhich TWO results of the King Street experiment surprised Alice? \nA more shoppers \nB improved safety \nC less air pollution \nD more relaxed atmosphere \nE less noise pollution\nCần gạch dưới “King Street experiment” vì đây là đối tượng chính của câu hỏi giúp mình xác định được vị trí của câu hỏi trong bài nghe. Ngoài ra cũng chú ý đến keyword “results” (kết quả) và “surprised Alice” (làm Alice ngạc nhiên). Như vậy, ta chỉ tập trung vào những kết quả mà làm Alice ngạc nhiên. \nTrong bài “surprised” (làm ngạc nhiên) được paraphrase lại thành các cụm từ “hadn’t expected” (không ngờ đến được) và “were amazed” (rất ngạc nhiên). \nGiải thích đáp án: \nTiếp theo, ta nghe được “We were actually amazed that sales in the shops went up considerably that day” (Chúng tôi đã thực sự ngạc nhiên khi doanh thu của các cửa hàng tăng vọt ngày hôm đó). Thông tin này hướng ta đến lựa chọn A “more shoppers” (nhiều người mua sắm hơn). Rõ ràng vì có nhiều người mua sắm hơn nên doanh thu các cửa hàng mới tăng vọt. Vì vậy đáp án thứ hai mà ta chọn được là A. \nTrước đó ta có nghe được “everyone said that they felt safer” (mọi người nói rằng họ cảm thấy an toàn hơn). Thông tin này hướng ta đến lựa chọn B nhưng ta không chọn đáp án này do trước câu này có “Of course” (Tất nhiên là). Như vậy, ta loại lựa chọn này vì nó không làm Alice ngạc nhiên."}}, "script_html": "<div class=\"script-line\"><span class=\"ts\">00:00</span><span class=\"txt\">Part two</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:01</span><span class=\"txt\">You will hear a woman called Alice Riches</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:05</span><span class=\"txt\">Talking on the radio about a scheme which involves closing streets to traffic to allow children to play</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:13</span><span class=\"txt\">First you have some time to look at questions 11 to 16</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:02</span><span class=\"txt\">Now listen carefully and answer questions 11 to 16</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:10</span><span class=\"txt\">My guest on the show today is Alice Riches who started the street play scheme where she lives in Beechwood Road</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:18</span><span class=\"txt\">For those of you that don't already know street play involves local residents closing off their street for a few hours</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:26</span><span class=\"txt\">So the children have a chance to play in the streets safely</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:29</span><span class=\"txt\">She started it in her own street Beechwood Road and the idea caught on and there are now</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:36</span><span class=\"txt\">Street play schemes all over the city. So when did you actually start the scheme Alice?</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:42</span><span class=\"txt\"><mark data-q=\"11\">Well, I first had the idea when my oldest child was still a toddler</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">01:46</span><span class=\"txt\"><mark data-q=\"11\">So that's about six years ago now, but it took at least two years of campaigning before we were actually able to make it happen</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">01:54</span><span class=\"txt\"><mark data-q=\"11\">So the scheme's been up and running for three years now</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">01:57</span><span class=\"txt\"><mark data-q=\"11\">We'd</mark><mark data-q=\"12\"> love to be able to close our road for longer for the whole weekend from Saturday morning until Sunday evening</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:04</span><span class=\"txt\"><mark data-q=\"12\">For example at the moment, it's just once a week</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:07</span><span class=\"txt\"><mark data-q=\"12\">But when we started it was only once a month, but we're working on it</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:12</span><span class=\"txt\"><mark data-q=\"12\">So what actually</mark> happens when Beechwood Road is closed? We have volunteer wardens</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:18</span><span class=\"txt\">Mostly <mark data-q=\"13\">parents, but some elderly residents too who block off our road at either end</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:24</span><span class=\"txt\"><mark data-q=\"13\">The council have provided special signs, but there's always a volunteer there to explain what's happening to any motorists</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:33</span><span class=\"txt\"><mark data-q=\"13\">Generally, they're fine about it. We've only had to get the police involved once or twice</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:39</span><span class=\"txt\"><mark data-q=\"13\">Now I should explain that the road isn't completely</mark> closed to <mark data-q=\"14\">cars, but only residents cars are allowed</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:46</span><span class=\"txt\"><mark data-q=\"14\">If people really need to get in or out of Beechwood Road</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:51</span><span class=\"txt\"><mark data-q=\"14\">It's not a problem as long as they drive at under 20 kilometres per hour</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:56</span><span class=\"txt\"><mark data-q=\"14\">But most people just decide not to use their cars during this time</mark> or they park in another street</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:03</span><span class=\"txt\">The wardens are only there to stop through traffic</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:07</span><span class=\"txt\">So can anyone apply to get involved in street play?</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:12</span><span class=\"txt\"><mark data-q=\"15\">Absolutely, we want to include all kids in the city</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">03:16</span><span class=\"txt\"><mark data-q=\"15\">Especially those who live on busy roads. It's here that demand is greatest</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">03:22</span><span class=\"txt\"><mark data-q=\"15\">Obviously there isn't such demand in wealthier areas where the children have access to parks or large gardens</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">03:29</span><span class=\"txt\"><mark data-q=\"15\">Or in the suburbs where there are usually more places for children to play outside</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">03:35</span><span class=\"txt\"><mark data-q=\"15\">I'd recommend that</mark> anyone listening who likes the idea should just give it a go</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:40</span><span class=\"txt\">We've been surprised by the positive reaction of residents all over the city and that's not just parents</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:47</span><span class=\"txt\">There are always a few who complain, but they're a tiny minority</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:53</span><span class=\"txt\">On the whole everyone is very supportive and say they're very happy to see children out on the street</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:59</span><span class=\"txt\">Even if it does get quite noisy</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:05</span><span class=\"txt\">Before you hear the rest of the conversation you have some time to look at questions 17 to 20</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:11</span><span class=\"txt\">Now listen and answer questions 17 to 20</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:38</span><span class=\"txt\">There have been so many benefits of street play for the kids</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:43</span><span class=\"txt\">Parents really like the fact that the kids are getting fresh air instead of sitting staring at a computer screen</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:49</span><span class=\"txt\">Even if they're not doing anything particularly energetic and of course</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:54</span><span class=\"txt\">It's great that kids can play with their friends outside without being supervised by their parents</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:00</span><span class=\"txt\"><mark data-q=\"17-18\">But for me the biggest advantage is that kids develop confidence in themselves to be outside without their parents</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:08</span><span class=\"txt\"><mark data-q=\"17-18\">The other really fantastic thing is that children get to know the adults in the street</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:13</span><span class=\"txt\"><mark data-q=\"17-18\">It's like having a big extended family.</mark> It certainly does have a lot of benefits</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:19</span><span class=\"txt\">I want to move on now and ask you about a related project in King Street, right?</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:25</span><span class=\"txt\">Well, this was an experiment</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:27</span><span class=\"txt\">I was involved in where local residents decided to try and reduce the traffic along King Street</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:33</span><span class=\"txt\">Which is the busiest main road in our area by persuading people not to use their cars for one day</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:40</span><span class=\"txt\">We thought about making people pay more for parking, but we decided that would be really unpopular</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:47</span><span class=\"txt\">So instead we just stopped people from parking on King Street, but left the other car parks open</span></div>\n<div class=\"script-line\"><span class=\"ts\">05:53</span><span class=\"txt\"><mark data-q=\"19-20\">it was surprising how much of a difference all this made as</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">05:58</span><span class=\"txt\"><mark data-q=\"19-20\">We'd predicted air quality was significantly better</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:02</span><span class=\"txt\"><mark data-q=\"19-20\">But what I hadn't expected was how much quieter it would be even with the buses still running</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:09</span><span class=\"txt\"><mark data-q=\"19-20\">Of course, everyone said they felt safer</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:11</span><span class=\"txt\"><mark data-q=\"19-20\">But we were actually amazed that sales in the shops went up considerably that day</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">06:16</span><span class=\"txt\"><mark data-q=\"19-20\">We thought there'd be fewer people out shopping not more.</mark> That's really interesting. So the fact that the street</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:23</span><span class=\"txt\">That is the end of part two</span></div>\n<div class=\"script-line\"><span class=\"ts\">06:29</span><span class=\"txt\">You now have 30 seconds to check your answers to part two</span></div>", "script_source": "asr (Whisper transcript provided by user, answer positions located via KEY + Teacher's Book)"}, {"part": 3, "audio": "Test1_Listening_audio/part3.mp3", "kind": "mcq", "groups": [{"qids": ["21", "22"], "prompt": "Which TWO points does Adam make about his experiment on artificial sweeteners?", "options": {"A": "The results were what he had predicted.", "B": "The experiment was simple to set up.", "C": "A large sample of people was tested.", "D": "The subjects were unaware of what they were drinking.", "E": "The test was repeated several times for each person."}, "multi": true, "header": "Questions 21 and 22 Choose TWO letters, A-E."}, {"qids": ["23", "24"], "prompt": "Which TWO problems did Rosie have when measuring the fat content of nuts?", "options": {"A": "She used the wrong sort of nuts.", "B": "She used an unsuitable chemical.", "C": "She did not grind the nuts finely enough.", "D": "The information on the nut package was incorrect.", "E": "The weighing scales may have been unsuitable."}, "multi": true, "header": "Questions 23 and 24 Choose TWO letters, A-E."}, {"qids": ["25"], "prompt": "Adam suggests that restaurants could reduce obesity if their menus", "options": {"A": "offered fewer options.", "B": "had more low-calorie foods.", "C": "were organised in a particular way."}, "multi": false, "header": "Questions 25-30 Choose the correct letter, A, B or C."}, {"qids": ["26"], "prompt": "The students agree that food manufacturers deliberately", "options": {"A": "make calorie counts hard to understand.", "B": "fail to provide accurate calorie counts.", "C": "use ineffective methods to reduce calories."}, "multi": false, "header": null}, {"qids": ["27"], "prompt": "What does Rosie say about levels of exercise in England?", "options": {"A": "The amount recommended is much too low.", "B": "Most people overestimate how much they do.", "C": "Women now exercise more than they used to."}, "multi": false, "header": null}, {"qids": ["28"], "prompt": "Adam refers to the location and width of stairs in a train station to illustrate", "options": {"A": "practical changes that can influence people’s behaviour.", "B": "methods of helping people who have mobility problems.", "C": "ways of preventing accidents by controlling crowd movement."}, "multi": false, "header": null}, {"qids": ["29"], "prompt": "What do the students agree about including reference to exercise in their presentation?", "options": {"A": "They should probably leave it out.", "B": "They need to do more research on it.", "C": "They should discuss this with their tutor."}, "multi": false, "header": null}, {"qids": ["30"], "prompt": "What are the students going to do next for their presentation?", "options": {"A": "prepare some slides for it", "B": "find out how long they have for it", "C": "decide on its content and organization"}, "multi": false, "header": null}], "answers": {"21": "C", "22": "D", "23": "C", "24": "E", "25": "C", "26": "A", "27": "B", "28": "A", "29": "A", "30": "C"}, "explanations": {"21": {"answer_label": "21 & 22. C & D", "quote": "Adam: Yeah. It took me ages to decide exactly how I'd organise it, especially how I could make sure that people didn't know which drink I was giving them. It was hard to keep track of it all, especially as I had so many people doing it - I had to make sure I kept a proper record\nof what each person had had.\nRosie: So could most people tell the difference?\nAdam: Yeah - I hadn't thought they would be able to, but most people could.", "explain": "Câu hỏi:\n21-22. Which TWO points does Adam make about his experiment on artificial sweeteners?\nA The results were what he had predicted.\nB The experiment was simple to set up.\nC A large sample of people was tested.\nD The subjects were unaware of what they were drinking.\nE The test was repeated several times for each person.\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n• Ở lựa chọn A, đoạn hội thoại bên chỉ ra rằng Adam đã không nghĩ rằng họ có thể phân biệt được sự khác nhau, nhưng hầu hết mọi người đều có thể. Vì vậy kết quả thí nghiệm không giống như những gì anh ấy đã dự đoán.\n• Ở lựa chọn B, đoạn hội thoại bên chỉ ra rằng Adam đã mất nhiều thời gian để quyết định chính xác cách anh ấy sắp xếp cuộc thí nghiệm. Vì vậy việt thiết lập cuộc thí nghiệm không hề đơn giản.\n• Ở lựa chọn C, đoạn hội thoại bên chỉ ra rằng thật khó để theo dõi tất cả, đặc biệt là khi anh ấy có rất nhiều người đang tham gia vào cuộc thí nghiệm đó. Có thể thấy rằng một một số lượng lớn người lấy mẫu đã được thử nghiệm. Vì vậy lựa chọn C là đáp án đúng.\n• Ở lựa chọn D, đoạn hội thoại bên chỉ ra rằng Adam phải đảm bảo rằng mọi người không biết anh ấy đang cho họ uống loại đồ uống nào. Có thể thấy rằng các đối tượng không được biết họ đang uống cái gì. Vì vậy lựa chọn C là đáp án đúng.\n• Ở lựa chọn E, đoạn hội thoại bên chỉ ra rằng Adam phải đảm bảo rằng anh ấy đã ghi chép chính xác những gì mỗi người đã uống. Có thể thấy rằng thử nghiệm không được lặp lại nhiều lần cho mỗi người.\nTừ những dữ kiện trên, ta có thể thấy C và D là đáp án đúng."}, "22": {"answer_label": "21 & 22. C & D", "quote": "Adam: Yeah. It took me ages to decide exactly how I'd organise it, especially how I could make sure that people didn't know which drink I was giving them. It was hard to keep track of it all, especially as I had so many people doing it - I had to make sure I kept a proper record\nof what each person had had.\nRosie: So could most people tell the difference?\nAdam: Yeah - I hadn't thought they would be able to, but most people could.", "explain": "Câu hỏi:\n21-22. Which TWO points does Adam make about his experiment on artificial sweeteners?\nA The results were what he had predicted.\nB The experiment was simple to set up.\nC A large sample of people was tested.\nD The subjects were unaware of what they were drinking.\nE The test was repeated several times for each person.\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n• Ở lựa chọn A, đoạn hội thoại bên chỉ ra rằng Adam đã không nghĩ rằng họ có thể phân biệt được sự khác nhau, nhưng hầu hết mọi người đều có thể. Vì vậy kết quả thí nghiệm không giống như những gì anh ấy đã dự đoán.\n• Ở lựa chọn B, đoạn hội thoại bên chỉ ra rằng Adam đã mất nhiều thời gian để quyết định chính xác cách anh ấy sắp xếp cuộc thí nghiệm. Vì vậy việt thiết lập cuộc thí nghiệm không hề đơn giản.\n• Ở lựa chọn C, đoạn hội thoại bên chỉ ra rằng thật khó để theo dõi tất cả, đặc biệt là khi anh ấy có rất nhiều người đang tham gia vào cuộc thí nghiệm đó. Có thể thấy rằng một một số lượng lớn người lấy mẫu đã được thử nghiệm. Vì vậy lựa chọn C là đáp án đúng.\n• Ở lựa chọn D, đoạn hội thoại bên chỉ ra rằng Adam phải đảm bảo rằng mọi người không biết anh ấy đang cho họ uống loại đồ uống nào. Có thể thấy rằng các đối tượng không được biết họ đang uống cái gì. Vì vậy lựa chọn C là đáp án đúng.\n• Ở lựa chọn E, đoạn hội thoại bên chỉ ra rằng Adam phải đảm bảo rằng anh ấy đã ghi chép chính xác những gì mỗi người đã uống. Có thể thấy rằng thử nghiệm không được lặp lại nhiều lần cho mỗi người.\nTừ những dữ kiện trên, ta có thể thấy C và D là đáp án đúng."}, "23": {"answer_label": "23 & 24. C & E", "quote": "Rosie: Yes. My results were a bit problematic - the fat content for that type of nut seemed much lower than it said on the package. But I reckon the package information was right. I think I should probably have ground up the nuts more than I did. It's possible that the scales for weighing the fat weren't accurate enough, too...", "explain": "Câu hỏi:\n23-24. Which TWO problems did Rosie have when measuring the fat content of nuts?\nA She used the wrong sort of nuts.\nB She used an unsuitable chemical.\nC She did not grind the nuts finely enough. D The information on the nut package was incorrect.\nE The weighing scales may have been unsuitable.\nGiải thích đáp án:\n• Ở lựa chọn A, thông tin về việc Rosie sử dụng sai loại hạt không được nhắc đến trong bài.\nỞ Ở lựa chọn B, thông tin về việc Rosie sử dụng loại hóa chất không phù hợp không được nhắc đến trong bài.\n• Ở lựa chọn C, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng cô ấy có lẽ nên nghiền các loại hạt kỹ hơn cô ấy đã làm. Có thể thấy vấn đề Rosie gặp phải là cô ấy chưa nghiền các loại hạt đủ mịn. Vì vậy lựa chọn C là đáp án đúng.\n• Ở lựa chọn D, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng các thông tin trên bao bì là đúng chứ không sai.\n• Ở lựa chọn E, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng có thể cân dùng để cân chất béo không đủ chính xác. Có thể thấy vấn đề Rosie gặp phải là cân có thể không phù hợp. Vì vậy lựa chọn E là đáp án đúng.\nTừ những dữ kiện trên, ta có thể thấy C và E là đáp án đúng."}, "24": {"answer_label": "23 & 24. C & E", "quote": "Rosie: Yes. My results were a bit problematic - the fat content for that type of nut seemed much lower than it said on the package. But I reckon the package information was right. I think I should probably have ground up the nuts more than I did. It's possible that the scales for weighing the fat weren't accurate enough, too...", "explain": "Câu hỏi:\n23-24. Which TWO problems did Rosie have when measuring the fat content of nuts?\nA She used the wrong sort of nuts.\nB She used an unsuitable chemical.\nC She did not grind the nuts finely enough. D The information on the nut package was incorrect.\nE The weighing scales may have been unsuitable.\nGiải thích đáp án:\n• Ở lựa chọn A, thông tin về việc Rosie sử dụng sai loại hạt không được nhắc đến trong bài.\nỞ Ở lựa chọn B, thông tin về việc Rosie sử dụng loại hóa chất không phù hợp không được nhắc đến trong bài.\n• Ở lựa chọn C, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng cô ấy có lẽ nên nghiền các loại hạt kỹ hơn cô ấy đã làm. Có thể thấy vấn đề Rosie gặp phải là cô ấy chưa nghiền các loại hạt đủ mịn. Vì vậy lựa chọn C là đáp án đúng.\n• Ở lựa chọn D, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng các thông tin trên bao bì là đúng chứ không sai.\n• Ở lựa chọn E, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng có thể cân dùng để cân chất béo không đủ chính xác. Có thể thấy vấn đề Rosie gặp phải là cân có thể không phù hợp. Vì vậy lựa chọn E là đáp án đúng.\nTừ những dữ kiện trên, ta có thể thấy C và E là đáp án đúng."}, "25": {"answer_label": "25. C", "quote": "Adam: There's a lot we could say about what restaurants could do to reduce obesity ... So, if you put the low-calorie items at the beginning and end of the menu, people will probably go for the food with fewer calories, without even realising what they're doing.", "explain": "Câu hỏi:\nChoose the correct letter, A, B, or C.\n25. Adam suggests that restaurants could reduce obesity if their menus\nA offered fewer options.\nB had more low-calorie foods.\nC were organised in a particular way.\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng Adam nghĩ rằng nếu đặt những món có hàm lượng calo thấp ở đầu và cuối thực đơn, mọi người có thể sẽ chọn món có ít calo hơn mà không hề nhận ra họ đang làm gì. Có thể thấy rằng Adam gợi ý rằng các nhà hàng có thể giảm béo phì nếu thực đơn của họ có nhiều các món ăn có hàm lượng calo thấp. Vì vậy lựa chọn B là đáp án đúng."}, "26": {"answer_label": "26. A", "quote": "Rosie: Well, when manufacturers put calorie counts of a food on the label, they're sometimes really confusing and I suspect they do it on purpose.\nAdam: Yeah, so if you look at the amount of calories in a pizza, they'll give you the calories per quarter pizza and you think, oh that's not too bad. But who's going to eat a quarter pizza? \nRosie: Exactly.", "explain": "Câu hỏi:\n26. The students agree that food manufacturers deliberately\nA make calorie counts hard to understand.\nB fall to provide accurate calorie counts. C use ineffective methods to reduce calories. Keywords được paraphrase: deliberately - on purpose\nhard to understand - confusing\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng cả hai đều đồng ý rằng khi các nhà sản xuất đưa số lượng calo của một loại thực phẩm lên nhãn, đôi khi họ cố tính khiến chúng thực sự khó hiểu. Vì vậy lựa chọn A là đáp án đúng."}, "27": {"answer_label": "27. B", "quote": "Adam: I suppose another approach to this problem is to get people to exercise more.\nRosie: Right. In England, ... about 40% of men and 30% of women say then do this, but when you objectively measure the amount of walking they do with motion sensors, you find that only 6% of men and 4% of women do the recommended amount of exercise.", "explain": "Câu hỏi:\n27. What does Rosie say about levels of exercise in England?\nA The amount recommended is much too low. B Most people overestimate how much they do. C Women now exercise more than they used to. Giải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng ở Anh, khoảng 40% nam giới và 30% phụ nữ nói họ có tập thể dục, nhưng khi bạn đo lường khách quan lượng đi bộ mà họ thực hiện bằng cảm biến chuyển động, bạn thấy rằng chỉ 6% nam giới và 4% phụ nữ làm theo khối lượng bài tập khuyến nghị.\nCó thể thấy rằng hầu hết mọi người đều đánh giá quá cao mức độ họ làm được. Vì vậy lựa chọn B là đáp án đúng."}, "28": {"answer_label": "28. A", "quote": "Adam: If people reach the stairs before they reach the escalator when they're leaving the station, they're more likely to take the stairs. And if you increase the width of the stairs, you'll get more people using them at the same time. It's an unconscious process and influenced by minor modifications in their environment.", "explain": "Câu hỏi:\n28. Adam refers the location and width of stairs in a train station to illustrate\nA practical changes that can influence people's behaviour.\nB methods of helping people who have mobility problems.\nC ways of preventing accidents by controlling crowd movement.\nKeywords được paraphrase:\nchanges - modifications\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng nếu mọi người đến cầu thang bộ trước khi họ đến thang cuốn khi rời nhà ga, thì nhiều khả năng họ sẽ đi cầu thang bộ. Và nếu bạn tăng chiều rộng của cầu thang, bạn sẽ có thêm nhiều người sử dụng chúng cùng một lúc. Đó là một quá trình vô thức và bị ảnh hưởng bởi những thay đổi nhỏ trong môi trường của họ.\nCó thể thấy rằng Adam đề cập đến vị trí và chiều rộng của cầu thang trong nhà ga xe lửa để minh họa những thay đổi thực tế có thể ảnh hưởng đến hành vi của mọi người. Vì vậy lựa chọn A là đáp án đúng."}, "29": {"answer_label": "29. A", "quote": "Adam: ... I'm not sure if we should be talking about exercise in our presentation.\nRosie: Well, we've done quite a bit of reading about it. Adam: I know, but it's going to mean we have a very wide focus, and our tutor did say that we need to focus on causes and solutions in terms of nutrition. Rosie: I suppose so. And we've got plenty of information about that. OK, well that will be simpler.", "explain": "Câu hỏi:\n29. What do the students agree about including reference to exercise in their presentation?\nA They should probably leave it out.\nB They need to do more research on it.\nC They should discuss this with their tutor.\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng cả Rose và Adam đều đồng ý rằng họ không nên đưa việc nói về việc tập thể dục vào trong bài thuyết trình của họ mà nên tập trung vào nguyên nhân và giải pháp liên quan đến dinh dưỡng.\nVì vậy lựa chọn A là đáp án đúng."}, "30": {"answer_label": "30. C", "quote": "Adam: So what shall we do now? We've still got an hour before our next lecture.\nRosie: Let's think about what we're going to include and what will go where.\nThen we can decide what slides we need. \nAdam: OK, fine.", "explain": "Câu hỏi:\n30. What are the students going to do next for their presentation?\nA prepare some slides for it\nB find out how long they have for it.\nC decide on its content and organisation.\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng cả hai đều đồng ý rằng việc họ làm tiếp theo cho bài thuyết trình là suy nghĩ về những gì họ sẽ bao gồm và những gì sẽ đi đến đâu.\nSau đó, họ có thể quyết định những slide nào mà họ cần.\nCó thể thấy rằng họ sẽ quyết định về nội dung và việc tổ chức bài thuyết trình của họ. Vì vậy lựa chọn C là đáp án đúng."}}, "script_html": "<div class=\"script-line\"><span class=\"ts\">00:00</span><span class=\"txt\">Part 3. You will hear two food science students called Adam and Rosie starting to plan their presentation on diet and obesity.</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:10</span><span class=\"txt\">First you have some time to look at questions 21 to 24. Now listen carefully and answer questions 21 to 24.</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:43</span><span class=\"txt\">OK Rosie, shall we try to get some ideas together for our presentation on diet and obesity?</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:49</span><span class=\"txt\">Sure.</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:50</span><span class=\"txt\">I can talk about the experiment I did to see if people can tell the difference between real sugar and artificial sweeteners.</span></div>\n<div class=\"script-line\"><span class=\"ts\">00:58</span><span class=\"txt\">Where you gave people drinks with either sugar or artificial sweeteners and they had to say which they thought it was.</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:04</span><span class=\"txt\">Yeah, it took me ages to decide exactly how I'd organise <mark data-q=\"21-22\">it, especially how I could make sure that people didn't know which drink I was giving them.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">01:14</span><span class=\"txt\"><mark data-q=\"21-22\">It was hard to keep track of it all, especially as I had so many people doing it. I had to make sure I kept a proper record of what each person had had.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">01:24</span><span class=\"txt\"><mark data-q=\"21-22\">So could most people tell the difference?</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">01:27</span><span class=\"txt\"><mark data-q=\"21-22\">Yeah, I hadn't thought that they would be able to, but most people could.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">01:32</span><span class=\"txt\"><mark data-q=\"21-22\">Then there's that experiment I did measuring the fat content</mark> of nuts to see if the nutritional information given on the packet was accurate.</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:41</span><span class=\"txt\">The one where you ground up the nuts and mixed them with a chemical to absorb the fat?</span></div>\n<div class=\"script-line\"><span class=\"ts\">01:47</span><span class=\"txt\">Yes. My results were a bit <mark data-q=\"23-24\">problematic. The fat content for that type of nut seemed much lower than it said on the package.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">01:56</span><span class=\"txt\"><mark data-q=\"23-24\">But I reckon the package information was right. I think I should probably have ground up the nuts more than I did.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:03</span><span class=\"txt\"><mark data-q=\"23-24\">It's possible that the scales for weighing the fat weren't accurate enough too.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">02:07</span><span class=\"txt\"><mark data-q=\"23-24\">I'd really like to try the experiment again</mark> sometime.</span></div>\n<div class=\"script-line\"><span class=\"ts\">02:14</span><span class=\"txt\">Before you hear the rest of the discussion, you have some time to look at questions 25 to 30.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:06</span><span class=\"txt\">Now listen and answer questions 25 to 30.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:13</span><span class=\"txt\">So what can we say about helping people to lose weight?</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:17</span><span class=\"txt\"><mark data-q=\"25\">There's a lot we could say about what restaurants could do to reduce obesity.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">03:22</span><span class=\"txt\"><mark data-q=\"25\">I read that the items at the start of a menu and the items at the end of a menu are much more likely to be chosen than the items in the middle.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">03:31</span><span class=\"txt\"><mark data-q=\"25\">So if you put the low calorie items at</mark> the beginning and end of the menu, people will probably go for the food with fewer calories without even realising what they're doing.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:43</span><span class=\"txt\">I think food manufacturers could do more to encourage healthy eating.</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:47</span><span class=\"txt\">How?</span></div>\n<div class=\"script-line\"><span class=\"ts\">03:47</span><span class=\"txt\"><mark data-q=\"26\">Well, when manufacturers put calorie counts of a food on the label, they're sometimes really confusing.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">03:55</span><span class=\"txt\"><mark data-q=\"26\">And I suspect they do it on purpose because food that's high in calories tastes better and so they'll sell more.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">04:03</span><span class=\"txt\"><mark data-q=\"26\">Yeah, so if you look at the amount of calories in a pizza, they'll give you the calories per quarter pizza and you think, oh, that's</mark> not too bad.</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:12</span><span class=\"txt\">But who's going to eat a quarter pizza?</span></div>\n<div class=\"script-line\"><span class=\"ts\">04:15</span><span class=\"txt\"><mark data-q=\"27\">Exactly.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">04:15</span><span class=\"txt\"><mark data-q=\"27\">I suppose another approach to this problem is to get people to exercise more.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">04:22</span><span class=\"txt\"><mark data-q=\"27\">Right. In England, the current guidelines offer at least 30 minutes of brisk walking five days a week.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">04:30</span><span class=\"txt\"><mark data-q=\"27\">Now, when you ask them, about 40% of men and 30% of women say they do this.</mark></span></div>\n<div class=\"script-line\"><span class=\"ts\">04:36</span><span class=\"txt\"><mark data-q=\"27\">But when you objectively measure the amo
